<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS2 Stats Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              faceit: "#ff5500",
              dark: "#121212",
              card: "#1e1e1e",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-dark text-gray-200 font-sans min-h-screen p-4 md:p-8 selection:bg-faceit selection:text-white"
  >
    <div class="max-w-5xl mx-auto">
      <div
        class="mb-10 text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-6"
      >
        <div>
          <h1 class="text-4xl font-extrabold text-white tracking-tight">
            CS2 <span class="text-faceit">Analytics</span>
          </h1>
          <p class="text-gray-400 mt-2">Детальна статистика та форма гравців</p>
        </div>

        <div class="flex w-full md:w-auto shadow-lg rounded-lg overflow-hidden">
          <input
            type="text"
            id="nicknameInput"
            placeholder="Нікнейм на Faceit..."
            class="w-full md:w-72 bg-card text-white px-4 py-3 outline-none border border-gray-700 focus:border-faceit transition-colors"
          />
          <button
            onclick="searchPlayer()"
            class="bg-faceit hover:bg-orange-600 text-white font-semibold px-6 py-3 transition-colors duration-200"
          >
            Знайти
          </button>
        </div>
      </div>

      <div
        id="errorMessage"
        class="hidden bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-6 text-center font-medium"
      ></div>

      <div id="playerCard" class="hidden space-y-6">
        <div
          class="bg-card border border-gray-800 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-6"
        >
          <div class="flex items-center gap-5">
            <img
              id="playerAvatar"
              src=""
              alt="Avatar"
              class="w-20 h-20 rounded-full border-2 border-gray-700 object-cover hidden shadow-lg"
            />
            <div
              id="playerAvatarFallback"
              class="flex items-center justify-center w-20 h-20 rounded-full border-2 border-gray-700 bg-gray-800 shadow-lg"
            >
              <svg
                class="w-10 h-10 text-gray-500"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                />
              </svg>
            </div>

            <div>
              <h2
                id="playerName"
                class="text-3xl font-bold text-white tracking-wide mb-2"
              >
                Nickname
              </h2>
              <div class="flex gap-2">
                <a
                  id="linkFaceit"
                  href="#"
                  target="_blank"
                  class="flex items-center justify-center w-8 h-8 rounded bg-[#ff5500] hover:bg-[#e64d00] transition-colors shadow"
                  title="Профіль Faceit"
                >
                  <svg
                    class="w-5 h-5 text-white"
                    fill="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M14.286 16.929l-3.215-3.214h-6.43v6.428h6.43l3.215-3.214zM21.786 8.357L18.57 5.143h-6.428v6.428h6.428l3.215-3.214zM10.714 5.143L7.5 8.357H1.071V1.93H7.5l3.214 3.213z"
                    ></path>
                  </svg>
                </a>
                <a
                  id="linkSteam"
                  href="#"
                  target="_blank"
                  class="flex items-center justify-center w-8 h-8 rounded bg-[#171a21] border border-gray-700 hover:border-gray-500 transition-colors shadow"
                  title="Профіль Steam"
                >
                  <svg
                    class="w-5 h-5 text-white"
                    fill="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M11.979 0C5.394 0 0 5.337 0 11.918c0 5.19 3.328 9.61 8.01 11.238l3.522-5.127c-.201-.06-.391-.141-.568-.242l-3.328 1.93c-.156.09-.344.02-.423-.14-.076-.155-.011-.343.14-.42l3.29-1.906c-1.353-1.096-2.146-2.823-1.928-4.704.148-1.284.81-2.457 1.815-3.22.684-.52 1.488-.844 2.336-.957l4.026-5.839C16.48 1.493 14.305 0 11.979 0zm6.814 1.996L14.78 7.821c.582.176 1.13.447 1.625.805 2.126 1.536 2.65 4.512 1.168 6.66l3.504 5.111C23.116 18.068 24 15.084 24 11.918 24 6.772 20.916 2.373 16.326.697l-3.07 1.299h.001A8.067 8.067 0 0 1 18.793 2zM15.46 9.771c-1.554-1.123-3.72-1.222-5.388-.236-1.666.985-2.404 3.012-1.83 4.887l2.883-4.18c.27-.393.815-.494 1.207-.225.394.27.495.815.226 1.208l-2.85 4.133c1.234.908 2.91 1.055 4.296.37 1.408-.696 2.228-2.164 2.144-3.71-.059-1.066-.541-2.074-1.341-2.801l-1.36 1.972a.846.846 0 0 1-.682.38.857.857 0 0 1-.856-.856c0-.284.14-.548.371-.699l1.355-1.965h-.001a4.93 4.93 0 0 0-.174-1.28z"
                    ></path>
                  </svg>
                </a>
              </div>
            </div>
          </div>

          <div class="flex gap-4">
            <div
              class="bg-gray-800 rounded-lg px-4 py-2 border border-gray-700 flex flex-col items-center"
            >
              <span
                class="text-xs text-gray-400 uppercase tracking-wider font-semibold"
                >Рівень</span
              >
              <span id="playerLevel" class="text-2xl font-bold text-faceit"
                >-</span
              >
            </div>
            <div
              class="bg-gray-800 rounded-lg px-4 py-2 border border-gray-700 flex flex-col items-center"
            >
              <span
                class="text-xs text-gray-400 uppercase tracking-wider font-semibold"
                >Elo</span
              >
              <span id="playerElo" class="text-2xl font-bold text-white"
                >-</span
              >
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-card border border-gray-800 rounded-2xl p-6 shadow-xl">
            <h3
              class="text-lg font-semibold text-gray-300 border-b border-gray-700 pb-3 mb-4 flex items-center gap-2"
            >
              <svg
                class="w-5 h-5 text-gray-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>
              Загальна статистика (Lifetime)
            </h3>
            <div class="space-y-4">
              <div class="flex justify-between items-end">
                <span class="text-gray-400">Всього матчів</span>
                <strong id="playerMatches" class="text-xl text-white font-mono"
                  >-</strong
                >
              </div>
              <div class="flex justify-between items-end">
                <span class="text-gray-400">Win Rate</span>
                <strong
                  id="playerWinrate"
                  class="text-xl text-green-400 font-mono"
                  >-</strong
                >
              </div>
            </div>
          </div>

          <div class="bg-card border border-gray-800 rounded-2xl p-6 shadow-xl">
            <h3
              class="text-lg font-semibold text-gray-300 border-b border-gray-700 pb-3 mb-4 flex items-center gap-2"
            >
              <svg
                class="w-5 h-5 text-faceit"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                ></path>
              </svg>
              Форма (останні 20 матчів)
            </h3>
            <div class="grid grid-cols-2 gap-4">
              <div class="bg-gray-800/50 rounded p-3 border border-gray-700/50">
                <div class="text-xs text-gray-500 mb-1">K/D Ratio</div>
                <div id="playerKD" class="text-lg font-bold text-white">-</div>
              </div>
              <div class="bg-gray-800/50 rounded p-3 border border-gray-700/50">
                <div class="text-xs text-gray-500 mb-1">K/R Ratio</div>
                <div id="playerKR" class="text-lg font-bold text-white">-</div>
              </div>
              <div class="bg-gray-800/50 rounded p-3 border border-gray-700/50">
                <div class="text-xs text-gray-500 mb-1">Середній ADR</div>
                <div id="playerADR" class="text-lg font-bold text-faceit">
                  -
                </div>
              </div>
              <div class="bg-gray-800/50 rounded p-3 border border-gray-700/50">
                <div class="text-xs text-gray-500 mb-1">Headshots</div>
                <div id="playerHS" class="text-lg font-bold text-white">-</div>
              </div>
              <div class="bg-gray-800/50 rounded p-3 border border-gray-700/50">
                <div class="text-xs text-gray-500 mb-1">Entry Kills</div>
                <div id="playerEntry" class="text-lg font-bold text-blue-400">
                  -
                </div>
              </div>
              <div class="bg-gray-800/50 rounded p-3 border border-gray-700/50">
                <div class="text-xs text-gray-500 mb-1">Снайпер</div>
                <div id="playerSniper" class="text-lg font-bold text-green-400">
                  -
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="bg-card border border-gray-800 rounded-2xl p-6 shadow-xl">
          <div class="flex gap-2 mb-6">
            <button
              id="btn-kd"
              onclick="changeChart('kd')"
              class="px-5 py-1.5 rounded-full text-sm font-bold bg-faceit text-white transition-colors"
            >
              K/D
            </button>
            <button
              id="btn-kr"
              onclick="changeChart('kr')"
              class="px-5 py-1.5 rounded-full text-sm font-bold bg-gray-800 text-gray-400 hover:bg-gray-700 transition-colors"
            >
              K/R
            </button>
            <button
              id="btn-hs"
              onclick="changeChart('hs')"
              class="px-5 py-1.5 rounded-full text-sm font-bold bg-gray-800 text-gray-400 hover:bg-gray-700 transition-colors"
            >
              HS%
            </button>
            <button
              id="btn-adr"
              onclick="changeChart('adr')"
              class="px-5 py-1.5 rounded-full text-sm font-bold bg-gray-800 text-gray-400 hover:bg-gray-700 transition-colors"
            >
              ADR
            </button>
          </div>

          <div class="flex flex-col lg:flex-row gap-4">
            <div
              class="flex-grow relative h-64 lg:h-80 border border-gray-800 rounded-lg p-4 bg-[#18181b]"
            >
              <canvas id="performanceChart"></canvas>
            </div>

            <div
              class="w-full lg:w-48 bg-[#18181b] border border-gray-800 rounded-lg p-5 flex flex-col justify-between"
            >
              <div>
                <div
                  id="panelCurrentVal"
                  class="text-3xl font-bold text-white mb-1"
                >
                  -
                </div>
                <div
                  id="panelMetricName"
                  class="text-sm font-bold text-gray-400"
                >
                  K/D
                </div>
              </div>
              <div class="space-y-3 text-sm mt-8">
                <div class="flex justify-between border-b border-gray-800 pb-2">
                  <span class="text-gray-400">Highest</span>
                  <span id="panelHighVal" class="text-white font-bold">-</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-gray-400">Lowest</span>
                  <span id="panelLowVal" class="text-white font-bold">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
