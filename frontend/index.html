<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS2 Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { faceit: "#ff5500", dark: "#121212", card: "#1e1e1e" },
          },
        },
      };
    </script>
    <style>
      #playerLevelIcon { image-rendering: -webkit-optimize-contrast; }
      .loader {
        border-top-color: #ff5500;
        animation: spinner 0.6s linear infinite;
      }
      @keyframes spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-dark text-gray-200 font-sans min-h-screen p-4 md:p-8 selection:bg-faceit selection:text-white">
    <div class="max-w-5xl mx-auto">
      
      <div class="mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
        <div>
          <h1 class="text-4xl font-extrabold text-white tracking-tight">
            CS2 <span class="text-faceit">Analytics</span>
          </h1>
        </div>

        <form onsubmit="searchPlayer(event); return false;" class="flex shadow-lg rounded-lg overflow-hidden border border-gray-800">
          <input
            type="text"
            id="nicknameInput"
            placeholder="Нікнейм на Faceit..."
            class="w-full md:w-72 bg-card text-white px-4 py-3 outline-none focus:bg-gray-800 transition-colors"
          />
          <button
            type="submit"
            id="searchBtn"
            class="bg-faceit hover:bg-orange-600 text-white font-semibold px-6 py-3 transition-colors flex items-center gap-2"
          >
            <span id="btnText">Знайти</span>
            <div id="btnSpinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          </button>
        </form>
      </div>

      <div id="errorMessage" class="hidden bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-6 text-center font-medium"></div>

      <div id="mainLoader" class="hidden flex flex-col items-center justify-center py-20">
        <div class="loader w-12 h-12 border-4 border-gray-700 rounded-full mb-4"></div>
        <p class="text-gray-400 font-medium animate-pulse">Збираємо дані з Faceit API...</p>
      </div>

      <div id="playerCard" class="hidden space-y-6">
        
        <div class="bg-card border border-gray-800 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-6">
          
          <div class="flex items-center gap-5">
            <img id="playerAvatar" src="" onerror="this.classList.add('hidden'); document.getElementById('playerAvatarFallback').classList.remove('hidden');" class="w-20 h-20 rounded-full border-2 border-gray-700 object-cover hidden shadow-lg" />
            
            <div id="playerAvatarFallback" class="w-20 h-20 rounded-full border-2 border-gray-700 bg-[#141414] flex items-center justify-center shadow-inner">
                <svg class="w-12 h-12 text-gray-700" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.11v4.71c0 4.14-2.83 8.01-7 9-4.17-.99-7-4.86-7-9V6.29l7-3.11z"/>
                    <path d="M12 7c-1.66 0-3 1.34-3 3s1.34 3 3 3s3-1.34 3-3s-1.34-3-3-3zm0 2a1 1 0 1 1 0 2a1 1 0 0 1 0-2zm0 6c-2.33 0-7 1.17-7 3.5V17h14v-.5c0-2.33-4.67-3.5-7-3.5zm-5 1.4c.5-.2 2.3-.6 5-.6s4.5.4 5 .6V16H7v-.6z" opacity=".5"/>
                </svg>
            </div>

            <div class="flex flex-col">
              <div class="flex items-center gap-3 mb-2">
                <h2 id="playerName" class="text-3xl font-bold text-white tracking-wide">-</h2>
                <img id="playerFlag" src="" class="w-6 h-4 rounded-sm hidden shadow-sm" title="" />
              </div>
              <div class="flex gap-3">
                <a id="linkFaceit" href="#" target="_blank" class="w-8 h-8 hover:scale-110 transition-transform">
                  <img src="assets/faceit.png" class="w-full h-full object-contain">
                </a>
                <a id="linkSteam" href="#" target="_blank" class="w-8 h-8 hover:scale-110 transition-transform">
                  <img src="assets/steam.png" class="w-full h-full object-contain">
                </a>
              </div>
            </div>
          </div>

          <div class="flex gap-8 items-center">
            <div class="text-center">
              <span class="text-xs text-gray-500 font-semibold uppercase tracking-widest">Elo</span>
              <div id="playerElo" class="text-3xl font-bold text-white tracking-tight">-</div>
            </div>
            <div class="w-16 h-16 flex items-center justify-center">
              <img id="playerLevelIcon" src="" class="w-full h-full object-contain hidden pointer-events-none">
              <span id="playerLevelFallback" class="text-xl font-bold text-gray-500">-</span>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-card border border-gray-800 rounded-2xl p-6">
            <h3 class="text-gray-400 text-sm font-bold mb-4 uppercase tracking-wider">Загальна статистика (Lifetime)</h3>
            <div class="space-y-4">
              <div class="flex justify-between border-b border-gray-800 pb-2"><span>Всього матчів</span><strong id="playerMatches" class="text-white font-mono">-</strong></div>
              <div class="flex justify-between border-b border-gray-800 pb-2"><span>Win Rate</span><strong id="playerWinrate" class="text-green-400 font-mono">-</strong></div>
              <div class="flex justify-between"><span>Загальний K/D</span><strong id="playerLifetimeKD" class="text-white font-mono">-</strong></div>
            </div>
          </div>

          <div class="bg-card border border-gray-800 rounded-2xl p-6">
            <h3 class="text-gray-400 text-sm font-bold mb-4 uppercase tracking-wider">Форма (останні 20 матчів)</h3>
            <div class="grid grid-cols-2 gap-4">
              <div class="bg-gray-800/30 p-3 rounded-lg text-center"><div class="text-xs text-gray-500 mb-1 font-bold">Справжній K/D</div><div id="playerKD" class="text-xl font-bold">-</div></div>
              <div class="bg-gray-800/30 p-3 rounded-lg text-center"><div class="text-xs text-gray-500 mb-1 font-bold">Середній K/R</div><div id="playerKR" class="text-xl font-bold">-</div></div>
              <div class="bg-gray-800/30 p-3 rounded-lg text-center"><div class="text-xs text-gray-500 mb-1 font-bold">Середній ADR</div><div id="playerADR" class="text-xl font-bold text-faceit">-</div></div>
              <div class="bg-gray-800/30 p-3 rounded-lg text-center"><div class="text-xs text-gray-500 mb-1 font-bold">Headshots</div><div id="playerHS" class="text-xl font-bold">-</div></div>
              <div class="bg-gray-800/30 p-3 rounded-lg text-center"><div class="text-xs text-gray-500 mb-1 font-bold">Entry Kills</div><div id="playerEntry" class="text-xl font-bold text-blue-400">-</div></div>
              <div class="bg-gray-800/30 p-3 rounded-lg text-center"><div class="text-xs text-gray-500 mb-1 font-bold">Снайпер</div><div id="playerSniper" class="text-xl font-bold text-green-400">-</div></div>
            </div>
          </div>
        </div>

        <div class="bg-card border border-gray-800 rounded-2xl p-6 shadow-xl">
          <div class="flex gap-2 mb-6">
            <button id="btn-kd" type="button" onclick="changeChart('kd')" class="px-5 py-1.5 rounded-full text-sm font-bold bg-faceit text-white transition-colors">K/D</button>
            <button id="btn-kr" type="button" onclick="changeChart('kr')" class="px-5 py-1.5 rounded-full text-sm font-bold bg-gray-800 text-gray-400 hover:bg-gray-700 transition-colors">K/R</button>
            <button id="btn-hs" type="button" onclick="changeChart('hs')" class="px-5 py-1.5 rounded-full text-sm font-bold bg-gray-800 text-gray-400 hover:bg-gray-700 transition-colors">HS%</button>
            <button id="btn-adr" type="button" onclick="changeChart('adr')" class="px-5 py-1.5 rounded-full text-sm font-bold bg-gray-800 text-gray-400 hover:bg-gray-700 transition-colors">ADR</button>
          </div>

          <div class="flex flex-col lg:flex-row gap-4">
            <div class="flex-grow h-64 lg:h-80 border border-gray-800 rounded-lg p-4 bg-[#18181b]">
              <canvas id="performanceChart"></canvas>
            </div>

            <div class="w-full lg:w-48 bg-[#18181b] border border-gray-800 rounded-lg p-5 flex flex-col justify-between">
              <div>
                <div id="panelCurrentVal" class="text-3xl font-bold text-white mb-1">-</div>
                <div id="panelMetricName" class="text-sm font-bold text-gray-400 uppercase">K/D</div>
              </div>
              <div class="space-y-3 text-sm mt-8">
                <div class="flex justify-between border-b border-gray-800 pb-2">
                  <span class="text-gray-400">Highest</span>
                  <span id="panelHighVal" class="text-white font-bold">-</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-gray-400">Lowest</span>
                  <span id="panelLowVal" class="text-white font-bold">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
